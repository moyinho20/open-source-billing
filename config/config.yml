development:
  app_host: locahost # e.g. osb.mydomain.com
  app_protocol: http
  activemerchant_billing_mode: test
  demo_mode: false
  encryption_key: 49118f49987f2b9271e2b7944c61834215b46680788659bd5079fba8a54394a6ef1e38f7ef85c80b5ef23bbeaece90c822d4e0f88514dc3b2062603924dead17

  paypal:
    enabled: false
    url: https://www.sandbox.paypal.com/cgi-bin/webscr?
    business: YOUR_PAYPAL_BUSINESS

  smtp_setting:
    address: smtp.gmail.com
    port: 587
    authentication: :plain
    enable_starttls_auto: true
    user_name: YOUR_EMAIL_HERE
    password: YOUR_PASSWORD_HERE

  quickbooks:
    # QuickBooksApp account key and secret
    consumer_key: YOUR_QUICKBOOKS_APP_CLIENT_ID
    consumer_secret: YOUR_QUICKBOOKS_APP_CLIENT_SECRET

production:
  app_host: <%= ENV.fetch('APP_HOST', 'localhost') %>
  app_protocol: <%= ENV.fetch('APP_PROTOCOL', 'https') %>
  activemerchant_billing_mode: <%= ENV.fetch('ACTIVEMERCHANT_BILLING_MODE', 'production') %>
  encryption_key: <%= ENV.fetch('ENCRYPTION_KEY', 'change-me-in-production') %>

  paypal:
    enabled: <%= ENV.fetch('PAYPAL_ENABLED', 'false') %>
    url: <%= ENV.fetch('PAYPAL_URL', 'https://www.paypal.com/cgi-bin/webscr?') %>
    business: <%= ENV.fetch('PAYPAL_BUSINESS', '') %>

  smtp_setting:
    address: <%= ENV.fetch('SMTP_ADDRESS', 'smtp.gmail.com') %>
    port: <%= ENV.fetch('SMTP_PORT', '587') %>
    authentication: :plain
    enable_starttls_auto: true
    user_name: <%= ENV.fetch('SMTP_USER_NAME', '') %>
    password: <%= ENV.fetch('SMTP_PASSWORD', '') %>

  quickbooks:
    consumer_key: <%= ENV.fetch('QUICKBOOKS_CONSUMER_KEY', '') %>
    consumer_secret: <%= ENV.fetch('QUICKBOOKS_CONSUMER_SECRET', '') %>
