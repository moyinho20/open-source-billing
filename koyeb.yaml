name: open-source-billing
type: web
deployment:
  type: docker
  docker:
    dockerfile: Dockerfile
regions:
  - was
instance_type: nano
scaling:
  min: 1
  max: 2
ports:
  - port: 8000
    protocol: http
routes:
  - path: /
    port: 8000
env:
  - key: RAILS_ENV
    value: production
  - key: RAILS_LOG_TO_STDOUT
    value: "true"
  - key: RAILS_SERVE_STATIC_FILES
    value: "true"
  - key: PORT
    value: "8000"
  - key: DATABASE_HOST
    value: ""
    secret: false
  - key: DATABASE_NAME
    value: ""
    secret: false
  - key: DATABASE_USER
    value: ""
    secret: true
  - key: DATABASE_PASSWORD
    value: ""
    secret: true
  - key: DATABASE_PORT
    value: "5432"
  - key: SECRET_KEY_BASE
    value: ""
    secret: true
  - key: ENCRYPTION_KEY
    value: ""
    secret: true
health_checks:
  - port: 8000
    protocol: http
    path: /
    interval: 30
    timeout: 10
    healthy_threshold: 2
    unhealthy_threshold: 3
