version: '3.8'
services:
  db:
    build:
      context: .
      dockerfile: ./docker/db/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: sergey
      MYSQL_DATABASE: photo_app
      MYSQL_USER: sergey
      MYSQL_PASSWORD: sergey
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - db_backups:/backups
      - ./docker/db/scripts:/scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sergey", "-psergey"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    volumes:
      - ./docker/web/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
  
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    volumes:
      - .:/myapp
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    tty: true

volumes:
  db_data:
  db_backups:
  bundle:
